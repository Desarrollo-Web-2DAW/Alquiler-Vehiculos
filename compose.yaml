# Desarrollo: un solo comando para levantar la infraestructura (RNF-05).
# Mailpit (RF-36): SMTP local en el puerto 1025 y bandeja de captura en http://localhost:8025
# Añadid aquí el resto de servicios del proyecto (PostgreSQL, MongoDB, Redis, API...).
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: alquiler-vehiculos-mailpit
    ports:
      - "1025:1025"   # SMTP (a lo que apunta Email:Host/Port en desarrollo)
      - "8025:8025"   # Bandeja web para ver los correos sin salir de la máquina
    restart: unless-stopped
